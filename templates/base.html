<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Redline — Website Security Testing & Endorsement{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom border-secondary-subtle sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
          <i class="bi bi-award text-warning fs-4"></i>
          <span>Redline</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-house-door me-1"></i>Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('endorsement') }}"><i class="bi bi-patch-check me-1"></i>Endorsement</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('legal') }}"><i class="bi bi-file-earmark-text me-1"></i>Legal</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">{% block content %}{% endblock %}</main>

    <footer class="border-top border-secondary-subtle py-4 mt-5">
      <div class="container d-flex flex-wrap justify-content-between gap-3 text-secondary small">
        <div>
          <i class="bi bi-award text-warning me-1"></i>
          &copy; {{ 2025 }} Redline. Website Security Testing &amp; Endorsement.
        </div>
        <div>
          Performance-based recognition for sites that pass our simulation-based tests.
          <a href="{{ url_for('legal') }}" class="ms-2">Legal Terms</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
